name: CI
# Pull requests and manual runs only (org rules: no push, no schedule). Each job runs only when its platform's files
# change and calls the repo's verify command for that platform: sh tools/verify.sh <platform>.
# Hosted runners on purpose: this repo is public, the org's self-hosted runners do not take public-repo jobs, and
# fork pull requests must not run on owner machines.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.f.outputs.windows }}
      linux: ${{ steps.f.outputs.linux }}
      macos: ${{ steps.f.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"; echo "linux=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          # The Windows installers live at the repo root, and windows/tests/scripts-test.ps1 tests them.
          for p in windows linux macos; do
            extra='^/'; [ "$p" = windows ] && extra='^[^/]* \(Windows\)\.cmd$'
            if echo "$files" | grep -qE "^($p/|tools/|\.github/)|$extra"; then echo "$p=true" >> "$GITHUB_OUTPUT"; else echo "$p=false" >> "$GITHUB_OUTPUT"; fi
          done

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify (build, self-test, script tests)
        shell: bash
        run: sh tools/verify.sh windows
      - name: Renders
        shell: powershell
        run: Start-Process windows/bin/HWWidget.exe -ArgumentList '--render', "$env:RUNNER_TEMP\render" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: windows-renders
          path: ${{ runner.temp }}/render

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/verify.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-renders
          path: linux/tests/out

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify (build, self-test, live probe)
        run: sh tools/verify.sh macos
      - name: Renders
        run: '"macos/build/HW Widget.app/Contents/MacOS/HWWidget" --render "$RUNNER_TEMP/render"'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-renders
          path: ${{ runner.temp }}/render
