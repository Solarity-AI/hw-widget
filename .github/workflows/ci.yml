name: CI
# Pull requests and manual runs only. Each job runs only when its platform's files change.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.f.outputs.windows }}
      linux: ${{ steps.f.outputs.linux }}
      macos: ${{ steps.f.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"; echo "linux=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          for p in windows linux macos; do
            if echo "$files" | grep -qE "^($p/|\.github/)"; then echo "$p=true" >> "$GITHUB_OUTPUT"; else echo "$p=false" >> "$GITHUB_OUTPUT"; fi
          done

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./windows/build.ps1
      - name: Self-test and renders
        shell: powershell
        run: |
          Start-Process windows/bin/HWWidget.exe -ArgumentList '--selftest', "$env:RUNNER_TEMP\selftest.txt" -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ((Get-Content "$env:RUNNER_TEMP\selftest.txt" -Tail 1) -notmatch ' 0 failed') { exit 1 }
          Start-Process windows/bin/HWWidget.exe -ArgumentList '--render', "$env:RUNNER_TEMP\render" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: windows-renders
          path: ${{ runner.temp }}/render

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh linux/tests/run-docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-renders
          path: linux/tests/out

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./macos/build.sh
      - name: Self-test, live probe and renders
        run: |
          bin="macos/build/HW Widget.app/Contents/MacOS/HWWidget"
          "$bin" --self-test
          "$bin" --probe 6
          "$bin" --render "$RUNNER_TEMP/render"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-renders
          path: ${{ runner.temp }}/render
